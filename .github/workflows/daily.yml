name: Daily liquidity update

on:
  schedule:
    - cron: '0 0 * * *' # 09:00 Asia/Seoul; GitHub may queue scheduled runs.
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'live-model.json'
      - 'update-status.json'

permissions:
  contents: read

concurrency:
  group: liquidity-pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read current published snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Validate calculations and failure preservation
        run: python3 -m unittest discover -s automation -p 'test_*.py' -v
      - name: Collect official observations and validate candidate
        run: python3 automation/update.py
      - name: Package verified page and observations
        run: python3 automation/package.py
      - name: Preserve source receipts for independent replay
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-source-snapshots
          path: .run/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
      - name: Save model and check status without changing other pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- live-model.json update-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update validated liquidity observations and source status [skip ci]'
            git push origin HEAD:main
          fi
      - name: Upload public page package
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Report retained model if core collection or validation failed
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          status=json.loads(Path('update-status.json').read_text())
          lines=['## Daily liquidity check', '', 'Result: '+status['state'], '', 'Failed sources keep the previous verified observations.', '']
          lines += [s['label']+': '+s['state']+' / '+s['observation_date'] for s in status['sources']]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(lines)+'\n')
          if status['state']=='failed':raise SystemExit('Previous model retained; inspect published status and source receipts.')
          PY
