name: Hourly liquidity observations

on:
  schedule:
    - cron: '23 * * * *' # Every hour at :23 UTC/KST; GitHub may delay runs.
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'state/**'
      - 'live-data.json'
      - 'chart-data.json'

permissions:
  contents: read

concurrency:
  group: liquidity-pages
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read current code and last successful receipts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Install pinned PDF disclosure parser
        run: |
          python3 -m venv .venv-cloud
          .venv-cloud/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify source contracts and failure preservation
        run: .venv-cloud/bin/python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Collect current observations with actual retrieval timestamps
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: .venv-cloud/bin/python -m model.cloud_feeds --output-root .run/live --checkpoint state/live --public-output live-data.json
      - name: Collect native current-vintage histories for display only
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: .venv-cloud/bin/python -m model.chart_history --output-root .run/chart-history --live-root state/live --checkpoint state/chart-history --public-output chart-data.json
      - name: Preserve full source receipts for replay
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: liquidity-source-receipts
          path: .run/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
      - name: Save latest receipts and bounded restart state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- state/live state/chart-history live-data.json chart-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update source observations and cloud checkpoint [skip ci]'
            git push origin HEAD:main
          fi
      - name: Package observation page and existing public archives
        run: .venv-cloud/bin/python automation/package_cloud.py
      - name: Upload public page package
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Report actual source coverage
        if: always()
        run: .venv-cloud/bin/python automation/report_cloud.py
